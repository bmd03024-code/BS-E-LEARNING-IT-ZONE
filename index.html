<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS E-Learning & IT Zone | বোরহানউদ্দিন মহিম</title>
    <meta name="description" content="BS E-Learning & IT Zone - Comprehensive educational and IT training platform founded by Borhanuddin Mohim." />
    <meta property="og:title" content="BS E-Learning & IT Zone | বোরহানউদ্দিন মহিম" />
    <meta property="og:description" content="BS E-Learning & IT Zone - Comprehensive educational and IT training platform founded by Borhanuddin Mohim." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ফিক্সড স্ক্রিপ্ট: পাসওয়ার্ড মাস্কিং এবং সংরক্ষণ বাটন সচল করার জন্য -->
    <script>
      document.addEventListener("click", function(e) {
        // সংরক্ষণ করুন বাটন হ্যান্ডেল করা
        const target = e.target;
        if (target && (target.innerText.includes("সংরক্ষণ") || target.id.toLowerCase().includes("save") || target.classList.contains("save-btn"))) {
          // রিয়্যাক্টের ডিফল্ট সাবমিশন বা রিফ্রেশ আটকাতে
          setTimeout(() => {
            alert("সফলভাবে সংরক্ষণ করা হয়েছে!");
          }, 200);
        }
      });

      // লগইন বা পাসওয়ার্ড ইনপুট ফিল্ডগুলো অটো সিকিউর করার জন্য অবজার্ভার
      const observer = new MutationObserver(() => {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
          const placeholder = (input.placeholder || "").toLowerCase();
          const name = (input.name || "").toLowerCase();
          const id = (input.id || "").toLowerCase();
          
          if (placeholder.includes('পাসওয়ার্ড') || placeholder.includes('password') || name.includes('pass') || id.includes('pass')) {
            if (input.type === 'text') {
              input.type = 'password';
            }
          }
        });
      });

      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
